name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1" # every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    # scans the commits in each push / pull request (the weekly run skips it,
    # so an already-rotated secret in old history doesn't fail every week)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Dependency audit + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # fail on high/critical issues in packages shipped to the browser
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Security headers are configured
        run: |
          for h in Content-Security-Policy X-Frame-Options X-Content-Type-Options Referrer-Policy Strict-Transport-Security; do
            grep -q "\"$h\"" vercel.json || { echo "Missing $h in vercel.json"; exit 1; }
          done
